name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . reportlab pypdf
      - run: python scripts/build_docs.py
      - run: python scripts/validate_content.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python scripts/validate_plugin.py plugin/legalflow-mx
      - run: python scripts/build_book.py
      - run: python scripts/preflight_pdf.py output/pdf/ai-legalflow-mx-guia-maestra-interior.pdf
      - run: bash scripts/build_release.sh
      - run: cd output/release && shasum -a 256 -c legalflow-mx-0.1.1.sha256
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . reportlab pypdf
      - name: Parse the PowerShell bootstrap without executing it
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Run CLI contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest tests.test_cli -q
      - name: Install a verified local release and create the Windows Demo
        shell: pwsh
        run: |
          bash scripts/build_release.sh
          $releaseDir = Join-Path $PWD 'output\release'
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '8765', '--directory', $releaseDir) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $env:LEGALFLOW_RELEASE_BASE = 'http://127.0.0.1:8765'
            $checksum = Join-Path $releaseDir 'legalflow-mx-0.1.1.sha256'
            $correctChecksum = Get-Content -LiteralPath $checksum -Raw
            Set-Content -LiteralPath $checksum -Value ('0' * 64 + '  legalflow-mx-0.1.1.tar.gz') -NoNewline
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ai-legalflow-mx-corrupt-test'
            & powershell -NoProfile -ExecutionPolicy Bypass -File packaging/install.ps1 -SkipSetup
            if ($LASTEXITCODE -eq 0) { throw 'Bootstrap accepted a corrupt checksum.' }
            if (Test-Path (Join-Path $env:LOCALAPPDATA 'AI-LegalFlow-MX\releases\0.1.1')) { throw 'Bootstrap wrote a corrupt release.' }
            Set-Content -LiteralPath $checksum -Value $correctChecksum -NoNewline
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ai-legalflow-mx-install-test'
            & powershell -NoProfile -ExecutionPolicy Bypass -File packaging/install.ps1 -SkipSetup
            if ($LASTEXITCODE -ne 0) { throw 'Windows bootstrap failed.' }
            $launcher = Join-Path $env:LOCALAPPDATA 'AI-LegalFlow-MX\bin\legalflow.cmd'
            if (-not (Test-Path $launcher)) { throw 'Launcher was not created.' }
            $workspace = Join-Path $env:RUNNER_TEMP 'Legal-IA'
            $result = & $launcher onboard --workspace $workspace --confirm --demo --json | ConvertFrom-Json
            if (-not $result.completed -or -not $result.local_only -or -not (Test-Path (Join-Path $workspace 'Demo\matter.yaml'))) { throw 'Onboarding Demo did not complete locally.' }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
